<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>FAS - Formula Auto Service</title>
  <defs>
    <!-- Frame luar merah glossy -->
    <linearGradient id="fFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset=".45" stop-color="#e01414"/>
      <stop offset="1" stop-color="#7e0404"/>
    </linearGradient>
    <!-- Interior merah gelap radial -->
    <radialGradient id="fInner" cx=".5" cy=".3" r="1">
      <stop offset="0" stop-color="#d41010"/>
      <stop offset=".55" stop-color="#9c0808"/>
      <stop offset="1" stop-color="#470202"/>
    </radialGradient>
    <!-- Silver untuk huruf A & S -->
    <linearGradient id="fSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e9edf3"/>
      <stop offset=".62" stop-color="#c2cbd7"/>
      <stop offset="1" stop-color="#93a0b1"/>
    </linearGradient>
    <!-- Merah untuk huruf F & aksen -->
    <linearGradient id="fRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff352a"/>
      <stop offset=".55" stop-color="#e51515"/>
      <stop offset="1" stop-color="#9e0606"/>
    </linearGradient>
    <!-- Gloss atas -->
    <linearGradient id="fGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Pola checker flag -->
    <pattern id="fCheck" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#1a0101" opacity=".32"/>
      <rect x="28" y="28" width="28" height="28" fill="#1a0101" opacity=".32"/>
    </pattern>
    <clipPath id="fClip"><rect x="22" y="22" width="468" height="468" rx="88"/></clipPath>
    <!-- Bentuk huruf (didefinisikan sekali, dipakai untuk bayangan & isi) -->
    <path id="gL-F" d="M0,0 H110 V46 H46 V78 H104 V122 H46 V200 H0 Z"/>
    <path id="gL-A" fill-rule="evenodd" d="M58,0 H92 L150,200 H104 L94,158 H46 L36,200 H0 Z M75,50 L90,118 H60 Z"/>
    <path id="gL-S" d="M0,0 H130 V48 H48 V88 H130 V200 H0 V152 H82 V136 H0 Z"/>
  </defs>

  <!-- Frame luar -->
  <rect x="6" y="6" width="500" height="500" rx="104" fill="url(#fFrame)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#5c0202" stroke-width="4" opacity=".75"/>

  <!-- Interior -->
  <rect x="22" y="22" width="468" height="468" rx="88" fill="url(#fInner)"/>
  <rect x="27" y="27" width="458" height="458" rx="83" fill="none" stroke="#2e0101" stroke-width="10" opacity=".4"/>

  <g clip-path="url(#fClip)">
    <!-- Checker flag kiri bawah -->
    <rect x="22" y="316" width="252" height="174" fill="url(#fCheck)"/>
    <!-- Streak cahaya diagonal -->
    <polygon points="60,490 200,316 252,316 112,490" fill="#ffffff" opacity=".05"/>
    <polygon points="152,490 292,316 322,316 182,490" fill="#ffffff" opacity=".04"/>
    <polygon points="300,490 420,316 452,316 332,490" fill="#ff3020" opacity=".1"/>
    <!-- Gloss atas -->
    <rect x="22" y="22" width="468" height="240" fill="url(#fGloss)"/>
  </g>

  <!-- Aksen sayap merah (kanan) -->
  <g fill="url(#fRed)" stroke="#400101" stroke-width="5" stroke-linejoin="round">
    <path d="M440,256 C458,234 476,214 488,198 C480,226 464,252 446,274 C440,280 434,281 431,277 C429,271 433,263 440,256 Z"/>
    <path d="M446,310 C472,284 490,252 494,224 C496,262 480,296 454,322 C436,340 410,350 386,347 C412,338 432,328 446,310 Z"/>
  </g>

  <!-- Wordmark FAS (italic) -->
  <g transform="translate(96,118) scale(0.85) skewX(-12)">
    <!-- Bayangan huruf -->
    <use href="#gL-F" transform="translate(7,9)" fill="#1c0101" opacity=".55"/>
    <use href="#gL-A" transform="translate(137,9)" fill="#1c0101" opacity=".55"/>
    <use href="#gL-S" transform="translate(307,9)" fill="#1c0101" opacity=".55"/>
    <!-- F merah dengan outline silver -->
    <use href="#gL-F" fill="url(#fRed)" stroke="#eef1f6" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
    <use href="#gL-F" fill="url(#fRed)" stroke="#5a0202" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- A silver dengan outline gelap -->
    <use href="#gL-A" transform="translate(130,0)" fill="url(#fSilver)" stroke="#3f434b" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
    <!-- S silver dengan outline gelap -->
    <use href="#gL-S" transform="translate(300,0)" fill="url(#fSilver)" stroke="#3f434b" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
  </g>

  <!-- Subtitle -->
  <text x="256" y="352" text-anchor="middle" textLength="424" lengthAdjust="spacingAndGlyphs"
        font-family="'Arial Black','Archivo Black',Arial,sans-serif" font-weight="900" font-style="italic"
        font-size="27" fill="url(#fSilver)" stroke="#2e0101" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <tspan fill="url(#fRed)">FORMULA</tspan><tspan> AUTO SERVICE</tspan>
  </text>
</svg>